# =========================================
# APP
# =========================================
spring.application.name=api-gateway
server.port=8080

# =========================================
# EUREKA
# =========================================
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# =========================================
# JWT
# =========================================
jwt.secret=${JWT_SECRET}

# =========================================
# SWAGGER UI
# =========================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/auth/v3/api-docs

springdoc.swagger-ui.urls[1].name=Order Service
springdoc.swagger-ui.urls[1].url=/orders/v3/api-docs

springdoc.swagger-ui.urls[2].name=Webhook Service
springdoc.swagger-ui.urls[2].url=/webhooks/v3/api-docs

springdoc.swagger-ui.urls[3].name=Notification Service
springdoc.swagger-ui.urls[3].url=/notifications/v3/api-docs

springdoc.swagger-ui.urls[4].name=Logging Service
springdoc.swagger-ui.urls[4].url=/logs/v3/api-docs

# =========================
# AUTH DOCS
# =========================
spring.cloud.gateway.routes[0].id=auth-docs
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/v3/api-docs/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

# =========================
# ORDER DOCS
# =========================
spring.cloud.gateway.routes[1].id=order-docs
spring.cloud.gateway.routes[1].uri=lb://order-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/orders/v3/api-docs/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

# =========================
# WEBHOOK DOCS
# =========================
spring.cloud.gateway.routes[2].id=webhook-docs
spring.cloud.gateway.routes[2].uri=lb://webhook-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/webhooks/v3/api-docs/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

# =========================
# NOTIFICATION DOCS
# =========================
spring.cloud.gateway.routes[3].id=notification-docs
spring.cloud.gateway.routes[3].uri=lb://notification-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/notifications/v3/api-docs/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1

# =========================
# LOGGING DOCS
# =========================
spring.cloud.gateway.routes[4].id=logging-docs
spring.cloud.gateway.routes[4].uri=lb://logging-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/logs/v3/api-docs/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[5].id=auth-service
spring.cloud.gateway.routes[5].uri=lb://auth-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[6].id=order-service
spring.cloud.gateway.routes[6].uri=lb://order-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/orders/**

spring.cloud.gateway.routes[7].id=webhook-service
spring.cloud.gateway.routes[7].uri=lb://webhook-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/webhooks/**

spring.cloud.gateway.routes[8].id=notification-service
spring.cloud.gateway.routes[8].uri=lb://notification-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/notifications/**

spring.cloud.gateway.routes[9].id=logging-service
spring.cloud.gateway.routes[9].uri=lb://logging-service
spring.cloud.gateway.routes[9].predicates[0]=Path=/logs/**